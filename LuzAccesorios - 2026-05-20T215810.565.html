<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Luz Accesorios</title><!-- v045048 --><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--lu:#C4A882;--lu2:#B8956A;--lu3:#F0E8E0;--lu4:#FBF7F4;--cr:#FFFFFF;--dk:#111111;--mid:#333333;--warm:#555555;--ok:#1A7A3C;--ok2:#EAF5EE;--err:#C0392B;--err2:#FDEDEC;--info:#0E7C7B;--info2:#E0F4F4;--bd:#E2D5C8;--bd2:#C4A882;--r:8px;--r2:12px;--sh:0 2px 8px rgba(0,0,0,.10)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:sans-serif;font-size:14px;background:#FBF7F4;color:#111111;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
/* BANNER BLANCO */
.banner{background:#FFFFFF;border-bottom:2px solid #E2D5C8;height:62px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 6px rgba(196,168,130,.1)}
.blogo{display:flex;align-items:center;gap:8px}
.b-r{display:flex;align-items:center;gap:14px}
.bst b{display:block;font-size:13px;font-weight:700;color:var(--lu)}
.bst small{font-size:9px;color:var(--warm);letter-spacing:1px;text-transform:uppercase;display:block}
.bsync{background:var(--lu3);border:1.5px solid var(--lu2);border-radius:20px;color:var(--mid);padding:5px 13px;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;font-family:sans-serif;transition:all .2s}
.bsync:hover{background:var(--lu);color:#fff}
/* NAV BLANCO */
.nav{background:#2E4057;display:flex;overflow-x:auto;flex-shrink:0;border-bottom:none}
.nav::-webkit-scrollbar{display:none}
.ebtn{font-size:9px;padding:1px 4px;border:1px solid var(--bd2);border-radius:3px;background:var(--lu3);cursor:pointer;color:var(--mid)}.ebtn:hover{background:var(--lu2);color:var(--dk)}
.nb{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:#C4A882;font-family:sans-serif;font-size:10px;cursor:pointer;transition:color .15s,background .15s;letter-spacing:.8px;text-transform:uppercase;font-weight:700;padding:10px 12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.nb:hover{color:#FFFFFF;background:rgba(196,168,130,.2)}.nb.on{color:#FFFFFF;border-bottom-color:#C4A882;font-weight:700}
/* CONTENT */
.ct{flex:1;overflow:auto;padding:14px;background:#FBF7F4}
.pane{display:none}.pane.on{display:block;animation:fi .18s ease}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
/* SPLASH */
#spl{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .35s}
#spl.h{opacity:0;pointer-events:none}
.sp-w{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sp-t{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--warm);margin-bottom:22px}
.spn{width:22px;height:22px;border:2px solid var(--lu3);border-top-color:var(--lu);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* TOAST */
#tst{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--dk);color:var(--lu);padding:9px 20px;border-radius:20px;font-size:11px;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;z-index:999;border:1px solid var(--lu);white-space:nowrap}
#tst.sh{opacity:1;transform:translateX(-50%) translateY(0)}
/* CARDS */
.card{background:#FFFFFF;border:none;border-radius:var(--r2);padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);border:1px solid #E0E0E0}
.ctit{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--dk);margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
/* KPIs */
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;margin-bottom:12px}
.kc{background:#FFFFFF;border:none;border-radius:var(--r2);padding:14px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);border:1px solid #E0E0E0;transition:box-shadow .15s}
.kc::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:#C4A882;border-radius:2px 0 0 2px}.kc.ok::before{background:#1A7A3C}.kc.err::before{background:#C0392B}.kc.info::before{background:#0E7C7B}
.kc.ok::before{background:var(--ok)}.kc.err::before{background:var(--err)}.kc.info::before{background:var(--info)}
.kl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#333333;margin-bottom:6px;font-weight:700}
.kv{font-family:'Nunito',sans-serif;font-size:22px;color:#0E7C7B;font-weight:800}
.kv.ok{color:#1A7A3C;font-weight:800}.kv.err{color:#C0392B;font-weight:800}.kv.info{color:var(--info);font-weight:800}
.ks{font-size:10px;color:var(--warm);margin-top:3px}
/* LAYOUT */
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* FORMS */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.fg label{font-size:10px;color:var(--mid);letter-spacing:.5px;font-weight:700;text-transform:uppercase}
.fg input,.fg select,.fg textarea{padding:8px 11px;border:1.5px solid var(--bd2);border-radius:var(--r);background:var(--lu4);color:var(--dk);font-family:sans-serif;font-size:13px;width:100%;outline:none;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--lu);background:var(--cr)}
.fg input[readonly]{background:var(--lu3);color:var(--warm)}
.fg textarea{resize:vertical;min-height:80px}
/* BUTTONS */
.btn{padding:8px 16px;border-radius:20px;border:1.5px solid var(--bd2);background:var(--cr);color:var(--dk);font-family:sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--lu3)}.btn-lu{background:var(--lu);color:#fff;border-color:var(--lu)}.btn-lu:hover{background:var(--lu2);color:var(--dk)}
.btn-sm{padding:4px 12px;font-size:10px}.btn-gh{background:none;border-color:transparent;color:var(--warm)}
.brow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:8px 9px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--warm);border-bottom:1.5px solid var(--bd2);font-weight:700;background:var(--lu3);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--bd);color:var(--warm);vertical-align:middle}
tr:hover td{background:var(--lu3)}.inv-row:hover{background:var(--lu3);cursor:pointer}.cc:hover{background:var(--lu3);transition:background .15s}.kc:hover{background:var(--lu3);transition:background .15s}.tdm{color:var(--dk);font-weight:600}
/* PILLS/BADGES */
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;white-space:nowrap}
.p-ok{background:#EAF5EE;color:#1A7A3C}.p-err{background:#FDEDEC;color:#C0392B}
.p-lu{background:var(--lu3);color:var(--mid)}.p-info{background:var(--info2);color:var(--info)}
.p-warn{background:#FEF3E2;color:#D4620A}
/* FILTER PILLS */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.fpill{background:none;border:1.5px solid var(--bd2);border-radius:20px;padding:3px 11px;font-size:10px;font-weight:700;cursor:pointer;font-family:sans-serif;color:var(--warm);transition:all .12s}
.fpill:hover,.fpill.on{background:#8B6F5E;border-color:#8B6F5E;color:#fff}
/* CHART BARS */
.bch{display:flex;align-items:flex-end;gap:4px}
.bc{display:flex;flex-direction:column;align-items:center;flex:1}
.bf{width:100%;background:linear-gradient(180deg,#4A6080,#2E4057);border-radius:4px 4px 0 0;min-height:2px}
.bf.ok{background:linear-gradient(180deg,#4CAF50,#1A7A3C)}.bf.neg{background:#C0392B}
.bl{font-size:8px;color:var(--warm);margin-top:3px;font-weight:600}
/* SEARCH BAR */
.sb input{width:100%;margin-bottom:10px;padding:9px 13px;border:1.5px solid var(--bd2);border-radius:20px;background:var(--cr);color:var(--dk);font-family:sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.sb input:focus{border-color:var(--lu)}
/* INVENTARIO LISTA */
.inv-tbl{background:var(--cr);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
.inv-row{display:grid;grid-template-columns:78px 1fr 70px 46px 80px 88px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .1s}
.inv-row:hover{background:var(--lu3)}.inv-row>div{padding:8px 7px;font-size:11px;color:var(--warm)}
.inv-row>.n{color:var(--dk);font-weight:600}.inv-head>div{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:var(--lu3)}
/* CARTERA */
.cc{background:var(--cr);border:1px solid var(--bd);border-left:3px solid var(--lu);border-radius:var(--r2);padding:12px 14px;margin-bottom:9px}
/* CALC */
.cbox{background:var(--lu4);border:1.5px solid var(--bd);border-radius:var(--r);padding:12px}
.crow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd);font-size:11px}
.crow:last-child{border-bottom:none;padding-top:7px;font-size:13px;font-weight:600}
.crow.hi{color:var(--lu);font-weight:600}.crow.ok{color:var(--ok)}.crow.err{color:var(--err)}
.cl{color:var(--warm)}.dv{height:1px;background:var(--bd2);margin:6px 0}
/* METAS BAR */
.mb-bg{width:100%;height:9px;background:var(--lu3);border-radius:5px;overflow:hidden;margin:6px 0 3px}
.mb-fl{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--lu),var(--lu2));transition:width .4s}
/* BAR CHART ROWS */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-lbl{font-size:10px;color:var(--warm);width:80px;flex-shrink:0;font-weight:600;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:6px;background:var(--lu3);border-radius:3px;overflow:hidden}
.bar-fl{height:100%;border-radius:3px}
.bar-val{font-size:10px;font-weight:700;min-width:85px;text-align:right}
/* TABS */
.its{display:flex;border-bottom:1.5px solid var(--bd);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.its::-webkit-scrollbar{display:none}
.it{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1.5px;padding:7px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;color:var(--warm);font-family:sans-serif;font-weight:700;white-space:nowrap}
.it.on{color:#8B6F5E;border-bottom-color:#8B6F5E}
.ip{display:none}.ip.on{display:block}
/* NOTA */
.nota{background:var(--lu3);border:1px solid var(--bd2);border-radius:var(--r);padding:9px 13px;font-size:11px;color:var(--mid);margin-bottom:11px;line-height:1.6;font-weight:500}
.nota strong{color:var(--dk)}.nota.info{background:var(--info2);border-color:var(--info);color:var(--info)}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(58,42,24,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.ov.sh{display:flex}
.mo{background:var(--cr);border-radius:var(--r2);width:100%;max-width:460px;max-height:88vh;overflow:auto;border:1px solid var(--bd)}
.mh{padding:13px 16px 11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.mh h3{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--dk)}
.mb2{padding:14px 16px}.mf{padding:11px 16px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end}
.xb{background:none;border:none;font-size:18px;cursor:pointer;color:var(--warm)}
/* EMPTY */
.emp{text-align:center;padding:24px;color:var(--warm);font-size:11px}
.emp-ico{font-size:26px;margin-bottom:6px;opacity:.4}
/* DROPDOWN BUSQUEDA */
.sg{display:none;position:absolute;top:100%;left:0;right:0;background:var(--cr);border:1.5px solid var(--bd2);border-radius:var(--r);z-index:50;max-height:160px;overflow:auto;box-shadow:var(--sh)}
.sg.sh{display:block}
.si{padding:8px 11px;cursor:pointer;font-size:11px;border-bottom:1px solid var(--bd);font-weight:500}
.si:hover{background:var(--lu3)}
@media(max-width:600px){.two{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.kg{grid-template-columns:1fr 1fr}.ct{padding:10px}.banner{height:54px;padding:0 10px}.b-r .bst:first-child{display:none}.inv-row{grid-template-columns:60px 1fr 55px 75px 70px}}

function setAno(a,modulo){
  AÑO_FIL=a;
  // When selecting current year, default to current month; else show all months
  var nowYear=String(new Date().getFullYear());

function getAños(){
  var años=[...new Set(DB.ana.map(function(x){return x.año;}))].sort();
  return años;
}
function filtrarAna(){
  if(AÑO_FIL==='todos')return DB.ana;
  return DB.ana.filter(function(x){return String(x.año)===String(AÑO_FIL);});
}
function filtrarGastos(){
  if(AÑO_FIL==='todos')return DB.gastos;

}
function getMeses(){
  var data=AÑO_FIL==='todos'?DB.ana:DB.ana.filter(function(x){return x.año===AÑO_FIL;});

function mesBar(modulo){
  var meses=getMeses();
  if(!meses.length)return '';
  var now=new Date();
  var mesActual=MES_S[now.getMonth()];
  if(MES_FIL==='todos'&&meses.indexOf(mesActual)>=0)MES_FIL=mesActual;

  MES_FIL=m;

  if(fnMap[modulo])fnMap[modulo]();
}
function filtrarAnaMes(){
  var a=filtrarAna();
  if(MES_FIL==='todos')return a;
  var filtered=a.filter(function(x){return x.mes===MES_FIL;});
  // If no data for selected month, return all
  return filtered.length?filtered:a;
}
function filtrarCart(){
  // Cartera acumulada: show all debt up to selected month/year
  if(AÑO_FIL==='todos'&&MES_FIL==='todos')return DB.cart;
  
  // Build accumulated cartera up to selected period
  var mesFil=MES_FIL==='todos'?null:MES_FIL;
  var anoFil=AÑO_FIL==='todos'?null:AÑO_FIL;
  var mesesOrden=MES_S;
  
  var res=[];
  DB.cart.forEach(function(x){
    var items=(x.items||[]).filter(function(i){
      var f=i.f||'';
      var parts=f.split('/');
      var iAno=parts.length===3?(parts[2].length===4?parts[2]:('20'+parts[2])):f.slice(0,4);
      var iMes='';
      if(parts.length===3){iMes=MES_S[parseInt(parts[1])-1]||'';}
      // Include if before or equal to selected period
      if(anoFil&&iAno>anoFil)return false;
      if(anoFil&&iAno===anoFil&&mesFil&&mesesOrden.indexOf(normMes(iMes))>mesesOrden.indexOf(normMes(mesFil)))return false;
      return true;
    });
    if(items.length){
      var total=items.reduce(function(s,i){return s+i.s;},0);
      if(total>0)res.push({cli:x.cli,total:total,items:items});
    }
  });
  return res;
}
function añoBar(modulo){

  años.forEach(function(a){
    btns.push('<button class="fpill '+(AÑO_FIL===a?'on':'')+'" onclick="setAno(\''+a+'\',\''+modulo+'\')">'+a+'</button>');
  });
  return '<div class="pills" style="margin-bottom:12px">'+btns.join('')+'</div>';
}
let CODES={LAR:0,LC:0,LP:0,LAN:0,LEAR:0,LS:0,LG:0,LJ:0,LO:0};
function recalcCodes(){
  Object.keys(CODES).forEach(function(pref){CODES[pref]=0;});
  DB.prods.forEach(function(p){
    var cod=String(p.cod||'').toUpperCase();
    Object.keys(CODES).forEach(function(pref){
      if(cod.startsWith(pref)){
        var n=parseInt(cod.slice(pref.length))||0;
        if(n>CODES[pref])CODES[pref]=n;
      }
    });
  });
}

    var catR=(parts[1]||'').toUpperCase().trim();
    var isCat=CATS_ALL.includes(catR);
    var cat,cuStr,saStr;
    if(isCat&&parts.length>=4){
      cat=catR;
      cuStr=parts[2];
      saStr=parts[3];
    } else if(isCat&&parts.length===3){
      cat=catR;
      cuStr=parts[2];
      saStr='0';
    } else {
      // No category provided - guess from name or default OTROS
      cat='OTROS';
      cuStr=parts[1];
      saStr=parts[2]||'0';
    }
    // Clean currency: remove $, spaces, dots used as thousands separator
    var cu=parseFloat((cuStr||'').replace(/[$\s]/g,'').replace(/\./g,'').replace(/,/g,'.'))||0;
    var sa=parseFloat((saStr||'').replace(/[$\s]/g,'').replace(/\./g,''))||0;
    if(!nom||!cu){err++;return;}
    var pref=PREFS[cat]||'LO';
    CODES[pref]=(CODES[pref]||0)+1;
    var cod=pref+String(CODES[pref]).padStart(3,'0');
    // Ensure no duplicate
    while(DB.prods.find(function(x){return x.cod===cod;})){
      CODES[pref]++;
      cod=pref+String(CODES[pref]).padStart(3,'0');
    }
    var calc=calcPrecioCol(cu,p);
    var colNom2=document.getElementById('col-nombre')?.value||'';
    COLECCION.push({cod:cod,nom:nom,cat:cat,cu:cu,sa:sa,pv:calc.sug,pvMin:calc.cTotal,calc:calc,img:'',imgRaw:'',col:colNom2});
    ok++;
  });
  if(ok){
    document.getElementById('col-bulk').value='';
    renderTablaCol();
    toast(ok+' referencias cargadas'+(err?' ('+err+' con error de formato)':''));
  } else {
    toast('Verifica el formato: NOMBRE, CATEGORIA, COSTO, STOCK',1);
  }
}

async function sheetGet(range){
  const url=BASE+encodeURIComponent(range)+'?key='+API_KEY;
  const r=await fetch(url);
  if(!r.ok){
    const d=await r.json();
    throw new Error(d.error?.message||'Error 400: '+range);
  }
  const d=await r.json();
  return d.values||[];
}

async function cargar(){
  const b=document.getElementById('bsy');b.textContent='Cargando...';b.disabled=true;
  try{
    const invR=await sheetGet('INVENTARIO!A2:S').catch(e=>{console.warn('INVENTARIO:',e.message);return[];});
    const ventR=await sheetGet('VENTAS!A2:N').catch(e=>{console.warn('VENTAS:',e.message);return[];});
    const gastR=await sheetGet('GASTOS!A2:E').catch(e=>{console.warn('GASTOS:',e.message);return[];});
    const pedR=await sheetGet('PEDIDOS!A2:G').catch(e=>{console.warn('PEDIDOS:',e.message);return[];});
    DB.prods=[];
    CODES={LAR:0,LC:0,LP:0,LAN:0,LEAR:0,LS:0,LG:0,LJ:0,LO:0};
    invR.forEach(function(r,rowIdx){
      const cod=String(r[1]||'').trim(),nom=String(r[4]||'').trim();
      if(!cod||!nom)return;
      const cat=String(r[3]||'').trim();
      const cu=Math.round(parseFloat(String(r[5]||'').replace(/[$, ]/g,''))||0);
      const pv=Math.round(parseFloat(String(r[6]||'').replace(/[$, ]/g,''))||0);
      const sa=Math.round(parseFloat(String(r[10]||r[8]||'').replace(/[$, ]/g,''))||0);
      DB.prods.push({cod:cod,cat:cat,nom:nom,cu:cu,pv:pv,sa:sa,img:'',col:'',desc:'',rowIdx:rowIdx});
      Object.values(PREFS).forEach(function(pref){if(cod.toUpperCase().startsWith(pref)){const n=parseInt(cod.replace(/\D/g,''))||0;if(n>CODES[pref])CODES[pref]=n;}});
    });
    const anaMap={},cartMap={};
    ventR.forEach(function(r){
      // VENTAS: FECHA(0) MES(1) AÑO(2) CLIENTE(3) CODIGO(4) REF(5) PV(6) TIPO(7) F_PAGO(8) ABONO(9) FORMA_PAGO(10) SALDO(11) PUNTO(12)
      var fRaw=String(r[0]||'');
      var mes=String(r[1]||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      var ano=String(r[2]||'').trim().replace(/\.0$/,''); // handle numeric year from formula
      var cli=String(r[3]||'').trim();
      var ref=String(r[5]||'').trim();
      var pvRaw=String(r[6]||'').replace(/[$\s]/g,'').replace(/,/g,'');
      var pv=parseFloat(pvRaw)||0;
      var salRaw=String(r[11]||'').replace(/[$\s]/g,'').replace(/,/g,'').replace(/-/g,'0');
      var sal=parseFloat(salRaw)||0;
      // Robust year/month detection
      if(!ano||ano.length!==4){
        if(fRaw.includes('/')){
          var pp=fRaw.split('/');
          if(pp.length===3){
            // DD/MM/YYYY or DD/MM/YY
            ano=pp[2].length===4?pp[2]:('20'+pp[2]);
            if(!mes)mes=MES_S[parseInt(pp[1])-1]||'';
          }
        } else if(!isNaN(parseFloat(fRaw))&&parseFloat(fRaw)>40000){
          var dd=new Date((parseFloat(fRaw)-25569)*86400000);
          ano=String(dd.getFullYear());
          if(!mes)mes=MES_S[dd.getMonth()]||'';
        } else if(fRaw.length>=4){
          ano=fRaw.slice(0,4);
        }
      }
      if(!mes&&fRaw.includes('/')){var pp2=fRaw.split('/');if(pp2.length===3)mes=MES_S[parseInt(pp2[1])-1]||'';}
      // Last resort: use current year if still empty
      if(!ano||ano.length!==4)ano=String(new Date().getFullYear());
      // Cartera - include ALL rows with saldo > 0 regardless of mes/pv
      if(sal>0&&cli){
        if(!cartMap[cli])cartMap[cli]={cli:cli,total:0,items:[]};
        cartMap[cli].total+=sal;
        cartMap[cli].items.push({p:ref,f:fRaw.slice(0,10),s:sal});
      }
      // Balance - only rows with mes and pv
      if(!mes||!pv)return;
      var mesNorm=mes.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
      var key=ano+'_'+mesNorm;
      if(!anaMap[key])anaMap[key]={año:ano,mes:mesNorm,ventas:0,gastos:0};
      anaMap[key].ventas+=pv;
    });
    DB.gastos=[];
    gastR.forEach(function(r){
      var mes=String(r[1]||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      var valRaw=String(r[3]||'').replace(/[$ ]/g,'').replace(/,/g,'').replace(/-/g,'');
      var val=parseFloat(valRaw)||0;
      var fRaw=String(r[0]||''),año='';
      if(fRaw.includes('/')){
        var parts=fRaw.split('/');
        if(parts.length===3) año=parts[2].length===4?parts[2]:('20'+parts[2]);
      } else if(!isNaN(parseFloat(fRaw))&&parseFloat(fRaw)>40000){
        var d=new Date((parseFloat(fRaw)-25569)*86400000);
        año=String(d.getFullYear());
        if(!mes)mes=MES_S[d.getMonth()];
      } else {año=fRaw.slice(0,4);}
      if(!mes||val<=0)return;
      const key=año+'_'+mes;
      if(!anaMap[key])anaMap[key]={año:año,mes:mes,ventas:0,gastos:0};
      anaMap[key].gastos+=val;
      DB.gastos.push({f:fRaw.slice(0,10),mes:mes,cat:String(r[2]||'').trim(),dsc:String(r[2]||'').trim(),val:val});
    });
    const ORDEN=MES_S;
    DB.ana=Object.values(anaMap).filter(function(x){return x.ventas>0;}).sort(function(a,b){if(a.año!==b.año)return a.año.localeCompare(b.año);return ORDEN.indexOf(a.mes)-ORDEN.indexOf(b.mes);});
    DB.ana.forEach(function(x){
      // Use real COGS if available, otherwise estimate 47%
      var realCOGS=getCOGSMes(x.mes,x.año);
      x.costos=realCOGS>0?realCOGS:Math.round(x.ventas*0.47);
      var realSal=getSalMes(x.mes,x.año);
      var realGF=getGFMes(x.mes,x.año);
      // If gastos already includes salario, use total gastos as-is
      x.ganNeta=x.ventas-x.costos-x.gastos;
    });
    DB.cart=Object.values(cartMap);
    // Recalculate codes to avoid duplicates
    recalcCodes();

    // Load images from REFERENCIAS sheet
    var refR=await sheetGet('REFERENCIAS!A2:F').catch(function(){return [];});
    var imgMap={},descMap={};
    refR.forEach(function(r){
      var cod=String(r[1]||r[0]||'').trim();
      // Try col D (index 3) first, then col C (index 2)
      var img=String(r[3]||r[2]||'').trim();
      var desc=String(r[5]||r[4]||'').trim();
      if(cod&&img){
        // Convert any Drive URL format to thumbnail
        if(img.includes('drive.google.com')){
          var m2=img.match(/\/d\/([^/?]+)/)||img.match(/id=([^&]+)/);
          if(m2)img='https://drive.google.com/thumbnail?id='+m2[1]+'&sz=w300';
        }
        if(img.startsWith('http'))imgMap[cod]=img;
      }
      if(cod&&desc)descMap[cod]=desc;
    });
    // Assign images to products
    DB.prods.forEach(function(p){
      var img=imgMap[p.cod]||'';
      // Only use valid URLs
      if(img&&(img.startsWith('http')||img.startsWith('/')))p.img=img;
      if(descMap[p.cod])p.desc=descMap[p.cod];
    });

    DB.peds=[];
    pedR.forEach(function(r){
      function cleanNum(v){return parseFloat(String(v||'').replace(/[$, USD]/g,'').replace(/\./g,'').replace(/,/g,'.'))||0;}
      var uds=cleanNum(r[3]),envio=cleanNum(r[5]),total=cleanNum(r[6]);
      var bruto=cleanNum(r[4]);
      if(!uds)return;
      var fRaw=String(r[1]||''),f='';
      if(fRaw.includes('/')){var pp=fRaw.split('/');f=pp.length===3?(pp[2].length===4?pp[2]+'-'+pp[1].padStart(2,'0')+'-'+pp[0].padStart(2,'0'):pp[2]+'-'+pp[1].padStart(2,'0')+'-'+pp[0].padStart(2,'0')):fRaw;}
      else f=fRaw.slice(0,10);
      if(!total&&bruto)total=bruto+envio;
      DB.peds.push({num:r[0],f:f,ord:String(r[2]||'').trim(),uds:uds,bruto:bruto,envio:envio,flu:Math.round(envio/(uds||1)),total:total});
    });
    var cliR=await sheetGet('CLIENTES!A2:B').catch(function(){return[];});DB.clientes={};cliR.forEach(function(r){var n=String(r[0]||'').trim(),w=String(r[1]||'').trim();if(n&&w)DB.clientes[n]=w;});
    // Also build client history from VENTAS
    DB.historial={};
    ventR.forEach(function(r){
      var cli=String(r[3]||'').trim();
      var ref=String(r[5]||'').trim();
      var pv=parseFloat(String(r[6]||'').replace(/[$\s,]/g,''))||0;
      var f=String(r[0]||'').slice(0,10);
      var tipo=String(r[7]||'').trim();
      if(!cli||!ref)return;
      if(!DB.historial[cli])DB.historial[cli]={compras:0,total:0,refs:[]};
      DB.historial[cli].compras++;
      DB.historial[cli].total+=pv;
      DB.historial[cli].refs.push({ref:ref,f:f,pv:pv,tipo:tipo});
    });
    initHdr();hideSpl();rInicio();toast('Datos cargados desde Sheets');
  }catch(e){
    hideSpl();toast('Error: '+e.message,1);console.error('cargar error:',e);
  }
  b.textContent='Sync';b.disabled=false;
}

function eliminarReferencia(cod){
  var p=DB.prods.find(function(x){return x.cod===cod;});
  if(!p)return;
  if(!confirm('Eliminar '+p.nom+' ('+cod+') del inventario?'))return;
  DB.prods=DB.prods.filter(function(x){return x.cod!==cod;});
  scriptPost('eliminarProducto',{cod:cod});
  toast('Eliminado — '+p.nom);
  initHdr();rInv();
}

function checkPvMin(){
  var pvI=document.getElementById('em-pv');
  var alert=document.getElementById('em-pv-alert');
  if(!pvI||!alert)return;
  var pv=+pvI.value||0;
  var min=window._editPvMin||0;
  if(!pv||!min){alert.innerHTML='';return;}
  if(pv<min){
    pvI.style.borderColor='var(--err)';
    pvI.style.background='var(--err2)';
    alert.innerHTML='<span style="color:var(--err);font-weight:600">Por debajo del punto de equilibrio — minimo: '+COP(min)+'</span>';
  } else {
    pvI.style.borderColor='var(--ok)';
    pvI.style.background='var(--ok2)';
    var gan=Math.round(pv*0.9)-min;
    alert.innerHTML='<span style="color:var(--ok);font-weight:600">Ganancia via DEEP: '+COP(gan)+'</span>';
  }
}

function closeEditModal(){
  var m=document.getElementById('edit-modal');

}

function guardarEdicion(cod){
  var p=DB.prods.find(function(x){return x.cod===cod;});
  if(!p)return;
  var nom=document.getElementById('em-nom')?.value||p.nom;
  var cat=document.getElementById('em-cat')?.value||p.cat;
  var cu=+document.getElementById('em-cu')?.value||p.cu;
  var pv=+document.getElementById('em-pv')?.value||p.pv;
  var sa=+document.getElementById('em-sa')?.value;
  var desc=document.getElementById('em-desc')?.value||'';
  var col=document.getElementById('em-col')?.value||'';
  var imgRaw=document.getElementById('em-img')?.value||'';
  // Convert Drive URL to thumbnail
  var imgThumb='';
  if(imgRaw&&imgRaw.includes('drive.google.com')){
    var m=imgRaw.match(/\/d\/([^/?]+)/)||imgRaw.match(/id=([^&]+)/);
    if(m)imgThumb='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w300';
  } else if(imgRaw&&imgRaw.startsWith('http')){
    imgThumb=imgRaw;
  }
  // Update local DB
  p.nom=nom;p.cat=cat;p.cu=cu;p.pv=pv;p.sa=sa;p.desc=desc;p.col=col;
  p.img=imgThumb;p.imgRaw=imgRaw;
  // Save to Sheets
  scriptPost('editarProducto',{cod:cod,nom:nom,cat:cat,cu:cu,pv:pv,sa:sa,desc:desc,col:col,img:imgRaw});
  closeEditModal();
  toast('Guardado — '+nom);
  initHdr();rInv();
}

function editStock(cod){
  var p=DB.prods.find(function(x){return x.cod===cod;});
  if(!p)return;
  var nuevo=prompt('Stock actual de '+p.nom+': '+p.sa+' uds - Nuevo stock:',p.sa);
  if(nuevo===null)return;
  var val=parseInt(nuevo);
  if(isNaN(val)){toast('Stock invalido',1);return;}
  p.sa=val;
  scriptPost('editarStock',{cod:cod,stock:val});
  toast('Stock: '+p.nom+' = '+val+' uds');
  initHdr();rInv();
}

function editPrecio(cod){
  var p=DB.prods.find(function(x){return x.cod===cod;});
  if(!p)return;
  var lp=DB.peds.length?DB.peds[DB.peds.length-1]:null;
  var flu=lp?lp.flu:0;
  var gfU=Math.round(GF/UM),salU=Math.round(SAL/UM);
  var cT=Math.round((p.cu+flu+EMP+gfU+salU)*1.1);
  var nuevo=prompt('Precio '+p.nom+' actual: '+COP(p.pv)+' | Min: '+COP(cT),p.pv||'');
  if(nuevo===null)return;
  var val=Math.round(parseFloat(String(nuevo).replace(/[$,.]/g,'').replace(/,/g,'.'))||0);
  if(!val){toast('Precio invalido',1);return;}
  if(val<cT&&!confirm('El precio '+COP(val)+' esta bajo el punto de equilibrio ('+COP(cT)+'). Confirmar?'))return;
  p.pv=val;
  scriptPost('editarPrecio',{cod:cod,pv:val});
  toast('Precio: '+p.nom+' = '+COP(val));
  rInv();
}

function calcNPq(){
  var cu=+document.getElementById('np-cu')?.value||0;
  if(!cu)return;
  var flu=Math.round(GF/10); // estimate flete per unit from last pedido
  if(DB.peds.length){var lp=DB.peds[DB.peds.length-1];flu=Math.round(lp.envio/lp.uds);}
  var gfU=Math.round(GF/UM),salU=Math.round(SAL/UM);

function agregarRefCarrito(){
  var ref=(document.getElementById('nv-ref')||{value:''}).value.trim();
  var pvFinal=+(document.getElementById('nv-pv')||{value:0}).value||0;
  var pvOrig=+(document.getElementById('nv-pv-orig')||{value:0}).value||pvFinal;
  var dsc=+(document.getElementById('nv-dsc')||{value:0}).value||0;
  var cod=(document.getElementById('nv-cod')||{value:''}).value||'';
  // If no final price calculated yet, use original
  if(!pvFinal&&pvOrig)pvFinal=Math.round(pvOrig*(1-dsc/100));
  if(!ref||!pvFinal){toast('Selecciona un producto y precio',1);return;}
  // Add discount note to ref name
  var refNom=ref;
  if(dsc>0)refNom=ref+' (Desc '+dsc+'%)';
  if(!window._carrito)window._carrito=[];
  window._carrito.push({ref:refNom,pv:pvFinal,cod:cod,pvOrig:pvOrig,dsc:dsc});
  // Clear product fields
  document.getElementById('nv-ref').value='';
  if(document.getElementById('nv-pv'))document.getElementById('nv-pv').value='';
  if(document.getElementById('nv-pv-orig'))document.getElementById('nv-pv-orig').value='';
  if(document.getElementById('nv-cod'))document.getElementById('nv-cod').value='';
  if(document.getElementById('nv-dsc'))document.getElementById('nv-dsc').value='0';
  renderCarrito();
  toast('Referencia agregada — '+refNom);
}
function quitarRefCarrito(i){

function calcDescuento(){
  var orig=+(document.getElementById('nv-pv-orig')||{value:0}).value||0;
  var dsc=Math.min(100,Math.max(0,+(document.getElementById('nv-dsc')||{value:0}).value||0));
  var final=orig>0?Math.round(orig*(1-dsc/100)):0;
  var pvEl=document.getElementById('nv-pv');
  if(pvEl)pvEl.value=final||'';
}

function getColParams(){
  return {
    flt:+document.getElementById('col-flt')?.value||0,
    uds:+document.getElementById('col-uds')?.value||1,
    emp:+document.getElementById('col-emp')?.value||1380,
    gf:+document.getElementById('col-gf')?.value||550000,
    sal:+document.getElementById('col-sal')?.value||600000,
    um:+document.getElementById('col-um')?.value||66
  };
}

function calcPrecioCol(cu,p){
  var fluU=Math.round(p.flt/p.uds);
  var gfU=Math.round(p.gf/p.um);
  var salU=Math.round(p.sal/p.um);
  var cd=cu+fluU+p.emp;
  var ct=cd+gfU+salU;
  var deep=Math.round(ct*0.1);
  var cTotal=ct+deep;
  // Precio sugerido = punto de equilibrio (margen 0%)
  // Tu lo ajustas hacia arriba segun el mercado
  var sug=cTotal;
  return {fluU:fluU,gfU:gfU,salU:salU,cd:cd,ct:ct,cTotal:cTotal,sug:sug};
}

function recalcCol(){
  var gfC=+document.getElementById('col-gf')?.value;
  var salC=+document.getElementById('col-sal')?.value;
  var umC=+document.getElementById('col-um')?.value;
  if(gfC)GF=gfC;
  if(salC)SAL=salC;
  if(umC)UM=umC;
  saveCalcSettings();
  var p=getColParams();
  COLECCION.forEach(function(r){
    var c=calcPrecioCol(r.cu,p);
    r.calc=c;r.pvMin=c.cTotal;
    if(r.pv<c.cTotal)r.pv=c.sug; // auto-ajustar si está por debajo
  });
  renderTablaCol();
}

function editFotoCol(i){
  var url=prompt('Pega el link de Google Drive para "'+COLECCION[i].nom+'":', COLECCION[i].imgRaw||'');
  if(url===null)return;
  var imgUrl='';
  if(url&&url.includes('drive.google.com')){
    var m=url.match(/\/d\/([^/]+)/);
    if(m){
      var fid=m[1];
      // Use thumbnail URL - works without login for public files
      imgUrl='https://drive.google.com/thumbnail?id='+fid+'&sz=w300';
    }
  } else if(url) {
    imgUrl=url; // direct URL
  }
  COLECCION[i].imgRaw=url;
  COLECCION[i].img=imgUrl;
  renderTablaCol();
  toast('Foto actualizada para '+COLECCION[i].nom);
}

function cargarColeccion(){
  if(!COLECCION.length){toast('Agrega referencias primero',1);return;}
  var errores=COLECCION.filter(function(r){return r.pv<r.pvMin;});
  if(errores.length){
    if(!confirm(errores.length+' referencias estan por debajo del punto de equilibrio. Cargar de todas formas?'))return;
  }
  var total=COLECCION.length;
  var idx=0;
  var btn=document.querySelector('[onclick="cargarColeccion()"]');
  if(btn){btn.disabled=true;btn.textContent='Cargando 0/'+total+'...';}

  function enviarLote(){
    if(idx>=COLECCION.length){
      toast(total+' referencias cargadas en Sheets');
      COLECCION=[];
      renderTablaCol();
      if(btn){btn.disabled=false;btn.textContent='Cargar '+total+' referencias al inventario';}
      initHdr();
      return;
    }
    var r=COLECCION[idx];
    var _rawImg=r.imgRaw||'';
    var _thumbImg=r.img||''; // thumbnail already converted by editFotoCol
    if(!_thumbImg&&_rawImg&&_rawImg.includes('drive.google.com')){
      var _m=_rawImg.match(/\/d\/([^/]+)/);
      if(_m)_thumbImg='https://drive.google.com/thumbnail?id='+_m[1]+'&sz=w300';
    }
    var prod={cod:r.cod,cat:r.cat,nom:r.nom,cu:r.cu,pv:r.pv,sa:r.sa||0,img:_thumbImg,desc:r.desc||'',col:r.col||''};
    DB.prods.unshift(prod);
    scriptPost('producto',prod);
    idx++;
    if(btn)btn.textContent='Cargando '+idx+'/'+total+'...';
    // Wait 800ms between each to avoid Apps Script timeout
    setTimeout(enviarLote, 800);
  }
  enviarLote();
}

function rMetas(){
  var now=new Date();
  var mesActual=MES_S[now.getMonth()];
  var anoActual=String(now.getFullYear());
  var diasMes=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  var diaHoy=now.getDate();
  var diasRestantes=diasMes-diaHoy;

  // Datos reales del mes actual
  var ventasMes=DB.ana.filter(function(x){
    return normMes(x.mes)===normMes(mesActual)&&String(x.año)===anoActual;
  }).reduce(function(s,x){return s+x.ventas;},0);

  // SAL y GF reales del mes actual
  var salMes=getSalMes(mesActual,anoActual)||SAL;
  var gfMes=getGFMes(mesActual,anoActual)||GF;
  var gastosTotalMes=salMes+gfMes;

  // Precio promedio de productos
  var prodsConPv=DB.prods.filter(function(p){return p.pv>0;});
  var avgPv=prodsConPv.length?Math.round(prodsConPv.reduce(function(s,p){return s+p.pv;},0)/prodsConPv.length):0;
  var avgCU=prodsConPv.length?Math.round(prodsConPv.reduce(function(s,p){return s+(p.cu||0);},0)/prodsConPv.length):0;
  var margenUnit=avgPv?Math.round((avgPv-avgCU)/avgPv*100):53;

  // Calcular metas reales
  // Meta mínima = gastos totales / margen unitario
  var metaMin=margenUnit>0?Math.round(gastosTotalMes/(margenUnit/100)):Math.round(gastosTotalMes/0.53);
  var metaCom=Math.round(metaMin*1.20); // +20% reinversión
  var metaAmb=Math.round(metaMin*1.38); // +38% ambiciosa

  // Unidades necesarias
  var udMin=avgPv?Math.ceil(metaMin/avgPv):0;
  var udCom=avgPv?Math.ceil(metaCom/avgPv):0;
  var udAmb=avgPv?Math.ceil(metaAmb/avgPv):0;

  // Ventas por día restantes
  var pdMin=diasRestantes>0?Math.max(0,Math.round((metaMin-ventasMes)/diasRestantes)):0;
  var pdCom=diasRestantes>0?Math.max(0,Math.round((metaCom-ventasMes)/diasRestantes)):0;
  var pdAmb=diasRestantes>0?Math.max(0,Math.round((metaAmb-ventasMes)/diasRestantes)):0;

  // Progress %
  var pMin=Math.min(100,metaMin>0?Math.round(ventasMes/metaMin*100):0);
  var pCom=Math.min(100,metaCom>0?Math.round(ventasMes/metaCom*100):0);
  var pAmb=Math.min(100,metaAmb>0?Math.round(ventasMes/metaAmb*100):0);

  function barMeta(pct,color){
    return '<div style="width:100%;height:10px;background:var(--lu3);border-radius:5px;overflow:hidden;margin:6px 0 3px">'+
      '<div style="height:100%;width:'+pct+'%;background:'+color+';border-radius:5px;transition:width .5s"></div></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--warm)">'+
      '<span>'+pct+'%</span><span>'+COP(ventasMes)+' / '+COP(pct===100?ventasMes:Math.round(ventasMes/(pct/100)))+'</span></div>';
  }

  function cardMeta(emoji,titulo,meta,ud,pd,pct,color,detalle){
  var alcanzada=ventasMes>=meta;
  var excedente=alcanzada?ventasMes-meta:0;
  return '<div class="card" style="border-left:4px solid '+color+';margin-bottom:10px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+

    '<div class="tip" data-tip="Si vendes exactamente esta cantidad cubres: costos de mercancía + todos tus gastos del mes" style="font-family:Cormorant Garamond,serif;font-size:1.5rem;color:var(--dk);font-weight:600;cursor:help">'+COP(meta)+'</div>'+

      '<span class="pill p-ok" style="font-size:11px">&#10003; +'+COP(excedente)+'</span>':
      '<span class="pill p-warn">Faltan '+COP(meta-ventasMes)+'</span>')+

    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">'+
    '<div class="tip" data-tip="Cantidad de piezas que necesitas vender para alcanzar esta meta, basado en tu precio promedio de '+COP(avgPv)+'" style="background:var(--lu3);border-radius:var(--r);padding:8px;text-align:center;cursor:help">'+
    '<div style="font-size:9px;color:var(--warm);font-weight:700;text-transform:uppercase">Uds necesarias</div>'+

    '<div class="tip" data-tip="'+(alcanzada?'20% del excedente sugerido para reinvertir en nuevo inventario':'Cuánto debes vender cada día restante del mes para alcanzar esta meta')+'" style="background:var(--lu3);border-radius:var(--r);padding:8px;text-align:center;cursor:help">'+

// ============ FUNCIONES FINANCIERAS REALES ============

// Obtener gastos reales de un mes/año específico
function getGastosMes(mes, ano){
  return DB.gastos.filter(function(g){
    var gMes=normMes(g.mes||'');
    var gAno='';
    if(g.f){
      var parts=String(g.f).split('/');
      if(parts.length===3)gAno=parts[2].length===4?parts[2]:('20'+parts[2]);
      else gAno=String(g.f).slice(0,4);
    }
    return gMes===normMes(mes)&&String(gAno)===String(ano);
  });
}

// Obtener SAL real de un mes
function getSalMes(mes, ano){
  var gastos=getGastosMes(mes, ano);
  var salRow=gastos.find(function(g){return normMes(g.dsc||g.cat||'').includes('salario');});
  return salRow?salRow.val:SAL; // fallback a SAL fijo
}

// Obtener GF real de un mes (todo excepto salario)
function getGFMes(mes, ano){
  var gastos=getGastosMes(mes, ano);
  var total=gastos.filter(function(g){
    return !normMes(g.dsc||g.cat||'').includes('salario');
  }).reduce(function(s,g){return s+g.val;},0);
  return total||GF; // fallback a GF fijo
}

// Promedio SAL/GF últimos 3 meses (para calculadora)
function getPromedioSAL(){
  var now=new Date();
  var totSal=0,count=0;
  for(var i=1;i<=3;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var mes=MES_S[d.getMonth()];
    var ano=String(d.getFullYear());
    var sal=getSalMes(mes,ano);
    if(sal>0){totSal+=sal;count++;}
  }
  return count?Math.round(totSal/count):SAL;
}

function getPromedioGF(){
  var now=new Date();
  var totGF=0,count=0;
  for(var i=1;i<=3;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var mes=MES_S[d.getMonth()];
    var ano=String(d.getFullYear());
    var gf=getGFMes(mes,ano);
    if(gf>0){totGF+=gf;count++;}
  }
  return count?Math.round(totGF/count):GF;
}

// Costo real de mercancía vendida en un mes
// Suma CU de cada producto vendido cruzando VENTAS con INVENTARIO
function getCOGSMes(mes, ano){
  var ventas=DB.ana.filter(function(x){
    return normMes(x.mes)===normMes(mes)&&String(x.año)===String(ano);
  });
  if(!ventas.length)return 0;
  // Get all sales rows for this month from raw ventR data
  // We don't have raw rows cached, so estimate from products
  // Use weighted average CU of products sold
  var totalCU=0,totalUds=0;
  DB.prods.forEach(function(p){
    if(p.cu>0&&p.pv>0){
      totalCU+=p.cu;
      totalUds++;
    }
  });
  var avgCU=totalUds?Math.round(totalCU/totalUds):0;
  // Estimate units sold = ventas / avgPv
  var totalVentas=ventas.reduce(function(s,x){return s+x.ventas;},0);
  var avgPv=totalUds?Math.round(DB.prods.filter(function(p){return p.pv>0;}).reduce(function(s,p){return s+p.pv;},0)/DB.prods.filter(function(p){return p.pv>0;}).length):0;
  var udsEst=avgPv?Math.round(totalVentas/avgPv):0;
  return Math.round(udsEst*avgCU);
}

// Unidades vendidas en un mes (estimado)
function getUdsMes(mes, ano){
  var ventas=DB.ana.filter(function(x){
    return normMes(x.mes)===normMes(mes)&&String(x.año)===String(ano);
  });
  var totalVentas=ventas.reduce(function(s,x){return s+x.ventas;},0);
  var prods=DB.prods.filter(function(p){return p.pv>0;});
  var avgPv=prods.length?Math.round(prods.reduce(function(s,p){return s+p.pv;},0)/prods.length):1;
  return Math.round(totalVentas/avgPv);
}

function smartReading(a){
  var el=document.getElementById('smart-reading');
  if(!el)return;
  if(!a||!a.length){el.innerHTML='<div style="color:#888;font-size:11px">Sin datos para este periodo.</div>';return;}
  var tV=a.reduce(function(s,x){return s+x.ventas;},0);
  var tG=a.reduce(function(s,x){return s+x.gastos;},0);
  var tC=a.reduce(function(s,x){return s+x.costos;},0);
  var gN=a.reduce(function(s,x){return s+x.ganNeta;},0);
  var avg=tV/a.length;
  var cart=DB.cart.reduce(function(s,x){return s+x.total;},0);
  var mesesSal=a.filter(function(x){return x.ganNeta>=SAL;}).length;
  var mgN=tV?Math.round(gN/tV*100):0;
  var mgB=tV?Math.round((tV-tC)/tV*100):0;
  var pctG=tV?Math.round(tG/tV*100):0;
  var pctCart=tV?Math.round(cart/tV*100):0;
  var faltaSal=Math.max(0,SAL*a.length-gN);
  var rows=[];

  function row(color,icon,txt,rec){
    return '<div style="padding:8px 0;border-bottom:1px solid var(--bd)">'+ 
      '<div style="display:flex;gap:8px;align-items:flex-start">'+ 
      '<span style="color:'+color+';font-size:15px;flex-shrink:0">'+icon+'</span>'+ 
      '<div><div style="font-size:12px;color:var(--dk);line-height:1.6">'+txt+'</div>'+ 
      (rec?'<div style="font-size:11px;color:var(--warm);margin-top:2px;font-style:italic">&#10141; '+rec+'</div>':'')+ 
      '</div></div></div>';
  }

  // Tendencia ventas
  if(a.length>1){
    var ult=a[a.length-1];
    var diff=avg>0?Math.round((ult.ventas-avg)/avg*100):0;
    if(diff>10) rows.push(row('#1A7A3C','&#8593;','Vendiste '+diff+'% más que tu promedio en el último mes.','Excelente momento para reinvertir o ampliar catálogo.'));
    else if(diff<-10) rows.push(row('#C0392B','&#8595;','Vendiste '+Math.abs(diff)+'% menos que tu promedio.','Activa promociones, escríbele a tus clientas frecuentes esta semana.'));
    else rows.push(row('#C4A882','&#8594;','Ventas estables en tu promedio de '+COP(Math.round(avg))+'/mes.','Busca un impulso: una promoción o lanzamiento de colección.'));
  }

  // Salario
  if(mesesSal===a.length) rows.push(row('#1A7A3C','&#10003;','Cubriste tu salario en todos los meses del periodo.','Considera separar el excedente para reinversión.'));
  else if(mesesSal===0) rows.push(row('#C0392B','&#9888;','No cubriste tu salario en ningún mes.','Revisa tus precios — necesitas subir márgenes o reducir gastos urgente.'));
  else {
    var faltaStr=faltaSal>0?' Te faltan '+COP(faltaSal)+' para cubrir tu salario acumulado.':'';
    rows.push(row('#D4620A','!','Cubriste tu salario '+mesesSal+' de '+a.length+' meses.'+faltaStr,'Identifica qué mes fue débil y qué lo causó.'));
  }

  // Margen
  if(mgN>=30) rows.push(row('#1A7A3C','&#9679;','Margen neto del '+mgN+'% — muy saludable.','Puedes reinvertir con confianza en nuevo inventario.'));
  else if(mgN>=15) rows.push(row('#D4620A','&#9679;','Margen neto del '+mgN+'% — aceptable pero mejorable.','Sube el precio de las referencias que más vendes en un 10% y evalúa el impacto.'));
  else rows.push(row('#C0392B','&#9679;','Margen neto del '+mgN+'% — muy bajo.','Necesitas subir precios o reducir costos. Revisa tu calculadora de punto de equilibrio.'));

  // Gastos
  if(pctG>40) rows.push(row('#C0392B','&#9632;','Tus gastos representan el '+pctG+'% de tus ventas.','Revisa cada gasto fijo — elimina lo que no genera valor directo al negocio.'));
  else if(pctG>25) rows.push(row('#D4620A','&#9632;','Gastos en '+pctG+'% de ventas — vigilar.','Están bajo control pero monitorea que no suban más.'));
  else rows.push(row('#1A7A3C','&#9632;','Gastos eficientes: '+pctG+'% de ventas.','Buen control. Mantén este nivel.'));

  // Cartera
  if(cart<=0) rows.push(row('#1A7A3C','&#10003;','Sin cartera pendiente. Todas las ventas están saldadas.',''));
  else if(pctCart>20) rows.push(row('#C0392B','&#9651;','Cartera de '+COP(cart)+' ('+pctCart+'% de ventas). Alta.','Prioriza cobrar antes de hacer nueva inversión. Escríbele a tus clientas hoy.'));
  else rows.push(row('#D4620A','&#9651;','Cartera pendiente: '+COP(cart)+' ('+pctCart+'% de ventas).','Envía recordatorio de pago esta semana.'));

  el.innerHTML=rows.join('');
}
